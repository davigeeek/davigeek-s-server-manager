<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>davigeek's server manager</title>
<link rel="icon" id="fav" href="/favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b2323; --panel:#382f2f; --panel2:#473f3f; --line:#474747; --text:#f1f1f1; --muted:#a3a3a3;
  --accent:#ea4444; --accent-ink:#ffffff; --ok:#5fd08f; --bad:#ff8c84;
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;font-family:var(--font)}
html{background:var(--bg)}
body{margin:0;color:var(--text);font-size:15px;line-height:1.5;min-height:100vh;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:12px;z-index:10;margin:12px 12px 0;border-radius:22px;padding:10px 14px 10px 22px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  background:rgba(100,88,88,.42);-webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%);
  box-shadow:0 8px 28px rgba(0,0,0,.28)}
.brand{font-weight:700;font-size:18px;cursor:pointer;justify-self:start}
.addr{position:relative;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.26);border-radius:999px;padding:5px 6px 5px 18px;min-width:240px;justify-content:space-between;border-color:rgba(234, 68, 68, 0.6)}
.addr code{font-weight:600;font-size:15px}
@property --ring{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ringSpin{to{--ring:360deg}}
.addr::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--ring),transparent 0deg,rgba(234, 68, 68, 0) 195deg,var(--accent) 300deg,#fce8e8 344deg,rgba(234, 68, 68, 0) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:ringSpin 2.6s linear infinite}
@media (prefers-reduced-motion:reduce){.addr::after{animation:none;background:conic-gradient(from 300deg,transparent 0deg,var(--accent) 60deg,transparent 120deg)}}
.addr .none{color:var(--muted)}
.top .right{justify-self:end}
@media(max-width:720px){header.top{grid-template-columns:1fr auto}.addr{grid-column:1/-1;grid-row:2;min-width:0}}

main{padding:26px 28px 60px;width:100%}
h1{font-size:26px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}

.btn{background:var(--panel2);border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
.btn:hover{background:#4d4646}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:#f25a5a}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 11px;font-size:13px;border-radius:8px}
#aSet, #aCopy{border-radius:999px}
#iconPick {margin-bottom:8px}
#totalSize {user-select: none}
.btn[disabled]{opacity:.5;cursor:default}
.btn.back{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:12px;flex:none}

.toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.toolbar .grow{flex:1;min-width:200px}
.toolbar input{width:220px}.toolbar select{width:150px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border-radius:16px;padding:18px}
.glass{background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.srv{cursor:pointer;display:flex;flex-direction:column;gap:14px;transition:background .15s;position:relative}
.srv:hover{background:rgba(255,255,255,.11)}
.srv.running{border-color:rgba(234, 68, 68, 0.6)}
.srv.running::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--ring),transparent 0deg,rgba(234, 68, 68, 0) 195deg,var(--accent) 300deg,#fce8e8 344deg,rgba(234, 68, 68, 0) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:ringSpin 2.6s linear infinite}
@media (prefers-reduced-motion:reduce){.srv.running::after{animation:none;background:conic-gradient(from 300deg,transparent 0deg,var(--accent) 60deg,transparent 120deg)}}
.titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.srv .row{display:flex;gap:14px;align-items:center}
.icon{width:60px;height:60px;border-radius:12px;image-rendering:pixelated;background:rgba(255,255,255,.08);object-fit:cover;flex:none;display:grid;place-items:center;font-weight:600;font-size:24px;color:var(--muted)}
.srv .name{font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.1);border-radius:7px;padding:1px 10px;font-size:13px;color:var(--muted)}
.chip.loader{color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:7px}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.state{font-size:13px;color:var(--muted)}
.new{border-style:dashed;border-color:rgba(255,255,255,.22);display:grid;place-items:center;min-height:140px;color:var(--muted);cursor:pointer;text-align:center}
.new:hover{color:var(--accent);border-color:var(--accent)}
.new b{display:block;font-size:36px;line-height:1;font-weight:300}

.head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.head .grow{flex:1;min-width:200px}
.tabs{display:flex;gap:4px;margin-bottom:22px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.blocks .wide{grid-column:1/-1}.blocks .half{grid-column:span 2}
@media(max-width:700px){.blocks .half{grid-column:1/-1}}
body.wide-page{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
main.wide{display:flex;flex-direction:column;flex:1;min-height:0;padding:20px 12px 12px;overflow:hidden}
main.wide #tab{flex:1;min-height:0;display:flex;flex-direction:column}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.split>.card{display:flex;flex-direction:column;min-height:0}
.split .scroll{flex:1;min-height:0;overflow:auto;padding-right:6px}
.split pre.con{height:auto;flex:1;min-height:0;margin:0}
@media(max-width:820px){body.wide-page{height:auto;overflow:visible}main.wide{flex:none;height:auto;overflow:visible}.split{grid-template-columns:1fr;height:auto}.split .scroll{overflow:visible;max-height:none}.split pre.con{height:420px}}
.k{color:var(--muted);font-size:13px;margin-bottom:4px}
.v{font-size:20px;font-weight:600;word-break:break-word}
.v.sm{font-size:15px;font-weight:500}
.card h3{margin:0 0 12px;font-size:16px;font-weight:600}

#sort {height:40.5px}
input[type=text],input[type=number],input[type=password],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%}
textarea{resize:vertical;min-height:64px}
.num{position:relative;display:flex;width:100%;min-width:0}
.num input[type=number]{-moz-appearance:textfield;appearance:textfield;padding-right:38px}
.num input[type=number]::-webkit-outer-spin-button,.num input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num .spin{position:absolute;top:1px;right:1px;bottom:1px;width:30px;display:flex;flex-direction:column;border-left:1px solid var(--line);border-radius:0 9px 9px 0;overflow:hidden}
.num .spin button{flex:1;background:var(--panel2);border:0;color:var(--muted);cursor:pointer;font-size:8px;line-height:1;display:grid;place-items:center;padding:0;transition:background .15s,color .15s}
.num .spin button:hover{background:var(--accent);color:var(--accent-ink)}
.num .spin button:first-child{border-bottom:1px solid rgba(0,0,0,.35)}
.inline .num{flex:1}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 4px}
.inline{display:flex;gap:8px}
pre.con{background:#1b1b1b;border-radius:12px;padding:14px;margin:0 0 10px;height:420px;overflow:auto;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.list .item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border:0}
.list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .nm.off{color:var(--muted);text-decoration:line-through}
.list img{width:40px;height:40px;border-radius:9px;flex:none;background:var(--panel2)}
.list .desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list .txt{flex:1;min-width:0}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{background:none;border:0;padding:5px 14px;cursor:pointer;color:var(--muted);border-radius:8px}
.seg button.on{background:var(--panel2);color:var(--text)}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 16px}
.danger-zone{border:1px solid rgba(255,140,132,.35)}
.muted{color:var(--muted)}.err{color:var(--bad)}

.motd-tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;align-items:center}
.sw{width:24px;height:24px;border-radius:7px;border:2px solid rgba(255,255,255,.18);cursor:pointer;padding:0}
.sw:hover{border-color:#fff}
.fmt{min-width:30px;padding:3px 9px}
.preview{background:#1b1b1b;border-radius:10px;padding:12px 14px;margin-top:10px;min-height:62px;color:#aaa;font-size:15px;line-height:1.45}
.iconrow{display:flex;gap:14px;align-items:center}
.iconrow .icon{width:64px;height:64px}

dialog{background:var(--panel);color:var(--text);border:0;border-radius:18px;padding:24px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 4px;font-size:20px;font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;color:var(--text);font-size:14px;margin-top:14px}
.check input{margin-top:4px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);padding:11px 20px;border-radius:12px;display:none;z-index:20;max-width:90vw;box-shadow:0 8px 28px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand" onclick="location.hash='#/'">davigeek's server manager</div>
  <div class="addr" id="addr"></div>
  <div class="right"><button class="btn" id="settingsBtn">Settings</button></div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = b => b > 1073741824 ? (b/1073741824).toFixed(1)+' GB' : b > 1048576 ? (b/1048576).toFixed(1)+' MB' : b > 0 ? Math.max(1,Math.round(b/1024))+' KB' : '0 KB';
const fmtUp = s => { const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h}h ${m}m` : `${m}m ${s%60}s`; };
const LOADERS = {vanilla:'Vanilla', paper:'Paper', purpur:'Purpur', fabric:'Fabric', forge:'Forge', neoforge:'NeoForge', quilt:'Quilt', spigot:'Spigot'};
const loaderName = l => LOADERS[l] || (l ? l[0].toUpperCase() + l.slice(1) : '');
const isPlugin = l => ['paper','purpur','spigot','bukkit'].includes(l);
let timers = [], tunnelAddr = '';

async function api(path, o = {}) {
  const r = await fetch('/api' + path, { method: o.method || 'GET', headers: {'Content-Type':'application/json'}, body: o.body ? JSON.stringify(o.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; t.style.outline = bad ? '1px solid var(--bad)' : 'none';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 5000);
}
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
function every(fn, ms) { timers.push(setInterval(guard(fn), ms)); }
const pref = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

const numField = ({ id, value, min = 512, step = 512, label = '' }) => `<div class="num"><input type="number" id="${id}" value="${value}" min="${min}" step="${step}" aria-label="${esc(label)}"><div class="spin"><button type="button" data-dir="1" aria-label="Increase" tabindex="-1">▲</button><button type="button" data-dir="-1" aria-label="Decrease" tabindex="-1">▼</button></div></div>`;
addEventListener('click', e => {
  const b = e.target.closest('.num .spin button'); if (!b) return;
  const inp = b.closest('.num').querySelector('input');
  const step = Number(inp.step) || 1, min = inp.min === '' ? -Infinity : Number(inp.min);
  inp.value = Math.max(min, (Number(inp.value) || 0) + step * Number(b.dataset.dir));
  inp.dispatchEvent(new Event('input', { bubbles: true }));
});

function setFavicon(on) {
  $('#fav').href = on ? '/favicon?v=' + Date.now() : "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>";
}
async function loadFavicon() {
  const s = await api('/settings');
  if (s.favicon) setFavicon(true);
}

async function copyClipboard(textCopied) {
    const tempInput = document.createElement("textarea");
    tempInput.value = textCopied;
    tempInput.style.position = "absolute";
    tempInput.style.left = "-9999px";
    document.body.appendChild(tempInput);
    tempInput.select();
    tempInput.setSelectionRange(0, 99999);
    const success = document.execCommand("copy");
    document.body.removeChild(tempInput);
};

async function loadAddress() {
  const { address, lan = [] } = await api('/tunnel'); tunnelAddr = address;
  const shown = address || lan[0] || '';
  $('#addr').innerHTML = shown ? `<code title="${address ? 'Permanent address' : 'Address on your local network'}">${esc(shown)}</code><button class="btn small" id="aCopy">Copy</button>` : `<span class="none">No server address set</span><button class="btn small" id="aSet">Set address</button>`;
  const codeText = document.querySelector('[title="Permanent address]');
  const c = $('#aCopy'); if (c) c.onclick = () => {copyClipboard(shown); toast('Address copied');};
  const s = $('#aSet'); if (s) s.onclick = () => $('#settingsBtn').click();
}

function openDialog(html) { const d = $('#dlg'); d.innerHTML = html; if (!d.open) d.showModal(); return d; }
const closeDialog = () => $('#dlg').close();

$('#settingsBtn').onclick = guard(async () => {
  const s = await api('/settings');
  openDialog(`<h2>Settings</h2>
    <label>server address shown at the top (your permanent tunnel URL)</label><input type="text" id="sAddr" value="${esc(s.public_address)}" placeholder="myserver.com">
    <label>servers folder</label><input type="text" id="sRoot" value="${esc(s.root)}">
    <label>default memory per server (MB)</label>${numField({ id: 'sRam', value: s.default_ram, step: 1024, label: 'default memory per server in MB' })}
    <label>curseforge API key ${s.curseforge_key_set ? '(saved, type to replace)' : ''}</label><input type="password" id="sCf" placeholder="from console.curseforge.com">
    <label>extra java path (optional, installed versions are found automatically)</label><input type="text" id="sJava" value="${esc(s.java === 'java' ? '' : s.java)}" placeholder="/opt/java/bin/java">
    <label>website icon</label>
    <div class="inline" style="align-items:center">
      <button class="btn small" id="fPick">Choose image</button><span class="muted" id="fName" style="flex:1">${s.favicon ? 'custom favicon set' : 'Default icon'}</span>
      ${s.favicon ? '<button class="btn small danger" id="fDel">Remove</button>' : ''}
    </div>
    <input type="file" id="fFile" accept=".png,.ico,.svg,image/png,image/x-icon,image/svg+xml" hidden>
    <label>addresses on your network</label>
    <div class="inline" style="align-items:center">
      <span class="state" id="lanList" style="flex:1;word-break:break-all">looking…</span>
      <button class="btn small" id="lanCopy">Copy</button>
    </div>
    <div id="fwWrap" style="display:none;margin-top:8px">
      <button class="btn small" id="fwBtn">allow through windows firewall</button>
      <span class="state" style="margin-left:8px">use this if other devices cannot connect.</span>
    </div>
    <p class="muted" style="font-size:12px;margin:14px 0 0">settings are stored in ${esc(s.config_dir)}</p>
    <div class="actions"><button class="btn" onclick="closeDialog()">Cancel</button><button class="btn primary" id="sSave">Save</button></div>`);
  guard(async () => {
    const net = await api('/network');
    const list = net.urls || [];
    $('#lanList').textContent = list.length ? list.join('   ') : 'No network address found';
    $('#lanCopy').onclick = () => { if (list[0]) navigator.clipboard?.writeText(list[0]).then(() => toast('Address copied')); };
    if (net.windows) {
      $('#fwWrap').style.display = 'block';
      $('#fwBtn').onclick = guard(async () => {
        const r = await api('/firewall', { method: 'POST', body: { confirm: true } });
        toast(r.note || 'Firewall rule requested');
      });
    }
  })();
  $('#sSave').onclick = guard(async () => {
    await api('/settings', { method: 'POST', body: { public_address: $('#sAddr').value.trim(), root: $('#sRoot').value, default_ram: +$('#sRam').value, java: $('#sJava').value.trim(), curseforge_key: $('#sCf').value } });
    closeDialog(); toast('Settings saved'); loadAddress(); route();
  });
  const drawFavicon = on => {
    setFavicon(on);
    $('#fName').textContent = on ? 'Custom favicon set' : 'Default icon';
    const old = $('#fDel'); if (old) old.remove();
    if (!on) return;
    const b = document.createElement('button');
    b.className = 'btn small danger'; b.id = 'fDel'; b.textContent = 'Remove';
    b.onclick = guard(async () => { await api('/favicon', { method: 'DELETE' }); drawFavicon(false); toast('Favicon removed'); });
    $('#fName').after(b);
  };
  if ($('#fDel')) $('#fDel').onclick = guard(async () => { await api('/favicon', { method: 'DELETE' }); drawFavicon(false); toast('Favicon removed'); });
  $('#fPick').onclick = () => $('#fFile').click();
  $('#fFile').onchange = guard(async ev => {
    const file = ev.target.files[0]; if (!file) return;
    if (file.size > 512 * 1024) throw new Error('the icon must be smaller than 512 KB');
    const r = await fetch('/api/favicon', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: file });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Upload failed');
    drawFavicon(true); toast('Icon saved');
  });
});

async function newServerDialog() {
  openDialog(`<h2>New server</h2><p class="muted" style="margin:0;font-size:14px">server files are downloaded for you</p>
    <label>Name (becomes the folder name)</label><input type="text" id="nName" placeholder="Epic Server">
    <div class="inline"><div style="flex:1"><label>Loader</label><select id="nLoader">${['vanilla','paper','purpur','fabric','forge','neoforge'].map(l => `<option value="${l}">${LOADERS[l]}</option>`).join('')}</select></div>
    <div style="flex:1"><label>Minecraft version</label><select id="nVer"></select></div></div>
    <div id="lvWrap"><label>Loader version</label><select id="nLv"></select></div>
    <label>Memory (MB)</label>${numField({ id: 'nRam', value: 4096, label: 'Memory in MB' })}
    <label class="check"><input type="checkbox" id="nEula"><span>I accept the <a href="https://aka.ms/MinecraftEULA" target="_blank" rel="noopener">Minecraft EULA</a></span></label>
    <pre class="con" id="nLog" style="display:none;height:120px;margin-top:14px"></pre>
    <div class="actions"><button class="btn" id="nCancel">Cancel</button><button class="btn primary" id="nGo">Create server</button></div>`);
  $('#nCancel').onclick = closeDialog;
  guard(async () => { $('#nRam').value = (await api('/settings')).default_ram; })();
  const loadLv = guard(async () => {
    const loader = $('#nLoader').value, mc = $('#nVer').value;
    $('#lvWrap').style.display = loader === 'vanilla' ? 'none' : 'block';
    if (loader === 'vanilla' || !mc) return;
    const sel = $('#nLv'); sel.innerHTML = '<option value="">loading…</option>';
    const v = await api(`/loader-versions?loader=${loader}&mc=${encodeURIComponent(mc)}`);
    if ($('#nLoader').value !== loader || $('#nVer').value !== mc) return;
    sel.innerHTML = `<option value="">Latest (recommended)</option>` + v.map(x => `<option>${esc(x)}</option>`).join('');
  });
  const loadVers = guard(async () => {
    const sel = $('#nVer'); sel.innerHTML = '<option>loading…</option>'; $('#nGo').disabled = true;
    const v = await api('/versions?loader=' + $('#nLoader').value);

const MC_COLORS = {'0':['#000000','Black'],'1':['#0000aa','Dark blue'],'2':['#00aa00','Dark green'],'3':['#00aaaa','Dark aqua'],'4':['#aa0000','Dark red'],'5':['#aa00aa','Purple'],'6':['#ffaa00','Gold'],'7':['#aaaaaa','Gray'],
  '8':['#555555','Dark gray'],'9':['#5555ff','Blue'],'a':['#55ff55','Green'],'b':['#55ffff','Aqua'],'c':['#ff5555','Red'],'d':['#ff55ff','Pink'],'e':['#ffff55','Yellow'],'f':['#ffffff','White']};
function motdHtml(t) {
  let st = {}, out = '', buf = '';
  const flush = () => {
    if (!buf) return;
    const css = []; if (st.c) css.push('color:' + MC_COLORS[st.c][0]); if (st.l) css.push('font-weight:700'); if (st.o) css.push('font-style:italic');
    const td = []; if (st.n) td.push('underline'); if (st.m) td.push('line-through'); if (td.length) css.push('text-decoration:' + td.join(' '));
    out += `<span style="${css.join(';')}">${esc(buf)}</span>`; buf = '';
  };
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (c === '&' && t[i + 1] === '&') { buf += '&'; i++; continue; }
    if (c === '&' && /[0-9a-fk-or]/i.test(t[i + 1] || '')) { flush(); const k = t[++i].toLowerCase(); if (MC_COLORS[k]) st = { c: k }; else if (k === 'r') st = {}; else st[k] = true; continue; }
    if (c === '\n') { flush(); out += '<br>'; continue; }
    buf += c;
  }
  flush(); return out || '&nbsp;';
}

  const d = await api(`/servers/${n}/properties`);
  if (!body.isConnected) return;
  if (!d.exists) { body.innerHTML = `<div class="card">no <code>server.properties</code> yet. start the server once and it will be generated.</div>`; return; }
  body.innerHTML = `<div class="card"><div class="props">${d.items.map((p, i) => {
      const bool = p.value === 'true' || p.value === 'false';
      return `<div><label>${esc(p.key)}</label>${bool ? `<select data-i="${i}"><option ${p.value === 'true' ? 'selected' : ''}>true</option><option ${p.value === 'false' ? 'selected' : ''}>false</option></select>` : `<input type="text" data-i="${i}" value="${esc(p.value)}">`}</div>`; }).join('')}</div>
    <div class="actions"><button class="btn primary" id="save">Save properties</button></div></div>`;
  $('#save').onclick = guard(async () => {
    const items = d.items.map((p, i) => ({ key: p.key, value: $(`[data-i="${i}"]`).value }));
    const r = await api(`/servers/${n}/properties`, { method: 'POST', body: { items } }); toast(r.note || 'Saved');
  });
}

function route() {
  timers.forEach(clearInterval); timers = [];
  const m = location.hash.match(/^#\/s\/([^/]+)\/?([^/]*)/);
  guard(async () => m ? serverView(decodeURIComponent(m[1]), m[2] || 'info') : listView())();
}
addEventListener('hashchange', route);
route(); guard(loadAddress)(); guard(loadFavicon)();
</script>
</body>
</html>
